name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
      # Ad-hoc sign so the .app launches without a real Developer ID.
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: YES
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: deriveddata-${{ runner.os }}-${{ matrix.configuration }}-${{ hashFiles('Zog.xcodeproj/project.pbxproj', 'Zog/**/*.swift') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ matrix.configuration }}-

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Zog.xcodeproj \
            -scheme Zog \
            -configuration ${{ matrix.configuration }} \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            CODE_SIGN_STYLE="$CODE_SIGN_STYLE" \
            CODE_SIGNING_REQUIRED="$CODE_SIGNING_REQUIRED" \
            CODE_SIGNING_ALLOWED="$CODE_SIGNING_ALLOWED" \
            build

      - name: Upload .app (Release only)
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Zog-${{ matrix.configuration }}-app
          path: build/DerivedData/Build/Products/${{ matrix.configuration }}/Zog.app
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: YES
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Download Release artifact
        uses: actions/download-artifact@v4
        with:
          name: Zog-Release-app
          path: build/artifact

      - name: Package .app
        run: |
          set -euo pipefail
          cd build/artifact
          ls -la
          # Stable filename regardless of runner arch.
          ditto -c -k --sequesterRsrc --keepParent Zog.app "zog-${{ github.ref_name }}-macos.zip"
          shasum -a 256 "zog-${{ github.ref_name }}-macos.zip" > "zog-${{ github.ref_name }}-macos.zip.sha256"
          ls -la

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/artifact/zog-${{ github.ref_name }}-macos.zip
            build/artifact/zog-${{ github.ref_name }}-macos.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
