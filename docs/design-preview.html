<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reference recreation</title>
<style>
  :root {
    --island: rgba(20, 20, 20, 0.78);
    --dock: rgba(12, 12, 12, 0.92);
    --fg: rgba(255, 255, 255, 0.95);
    --muted: rgba(255, 255, 255, 0.5);
    --green: #52d16a;
    --yellow: #f5c84b;
    --blue: #5a9bfa;
    --cyan: #6fd8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #08090b;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: var(--fg);
  }
  .screen {
    position: relative;
    width: 1280px;
    height: 800px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    background:
      radial-gradient(ellipse 70% 55% at 28% 38%, #6a7a94 0%, transparent 58%),
      radial-gradient(ellipse 55% 45% at 72% 68%, #5c4a6e 0%, transparent 52%),
      linear-gradient(155deg, #3d4558 0%, #252a36 48%, #2a2535 100%);
  }
  /* soft grain */
  .screen::after {
    content: "";
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    opacity: 0.45;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  .pod {
    position: absolute;
    top: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    padding: 0 11px;
    background: var(--island);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 12px;
    border: 0.5px solid rgba(255,255,255,0.06);
    font-size: 13px;
    white-space: nowrap;
    z-index: 2;
  }
  .pod.sq { width: 30px; padding: 0; justify-content: center; border-radius: 10px; }
  .pod.media {
    height: 42px;
    border-radius: 14px;
    padding: 0 12px;
    gap: 10px;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
  }

  .apple { left: 14px; }
  .app { left: 50px; }
  .mail { right: 318px; }
  .utils { right: 210px; }
  .status { right: 118px; }
  .clock {
    right: 70px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .ico {
    width: 15px; height: 15px; border-radius: 4px;
    background: linear-gradient(145deg, #7b8ef0, #3d4fc4);
  }
  .art {
    width: 26px; height: 26px; border-radius: 5px;
    background: #111;
  }
  .t { font-weight: 600; line-height: 1.1; font-size: 13px; }
  .a { font-size: 11px; color: var(--muted); }
  .menus { display: flex; gap: 12px; margin-left: 2px; }
  .menus span { opacity: 0.9; font-weight: 400; }
  .ctrl { display: flex; gap: 12px; font-size: 10px; opacity: 0.9; }
  .g { color: var(--green); }

  /* —— vertical dock (refs 1 & 4) —— */
  .dock {
    position: absolute;
    top: 50%;
    right: 14px;
    transform: translateY(-50%);
    width: 44px;
    padding: 14px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    background: var(--dock);
    border-radius: 22px;
    border: 0.5px solid rgba(255,255,255,0.06);
    box-shadow: 0 10px 28px rgba(0,0,0,.4);
    z-index: 2;
  }
  .dock > * { flex-shrink: 0; }

  .cube {
    width: 14px; height: 15px;
    margin-bottom: 12px;
    background:
      linear-gradient(135deg, transparent 40%, var(--fg) 40%, var(--fg) 42%, transparent 42%),
      linear-gradient(-135deg, transparent 40%, var(--fg) 40%, var(--fg) 42%, transparent 42%);
    border: 1.2px solid var(--fg);
    border-radius: 1px;
    position: relative;
  }
  .cube::before {
    content: "";
    position: absolute;
    inset: 2px;
    border: 1px solid var(--fg);
    opacity: 0.7;
  }

  .grid3 {
    display: grid;
    grid-template-columns: repeat(3, 2.2px);
    gap: 1.8px;
    margin-bottom: 2px;
  }
  .grid3 i {
    width: 2.2px; height: 2.2px; border-radius: 50%;
    background: var(--fg); display: block;
  }

  .micro {
    width: 2px; height: 2px; border-radius: 50%;
    background: rgba(255,255,255,0.22);
    margin: 10px 0;
  }

  .spaces {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .spaces .d {
    width: 7px; height: 7px; border-radius: 50%;
  }
  .spaces .d.on { width: 8px; height: 8px; }
  .spaces .div {
    width: 2px; height: 2px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
  }
  .y { background: var(--yellow); }
  .b { background: var(--blue); }
  .c { background: var(--cyan); opacity: 0.45; }

  .geo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 11px;
    margin-top: 2px;
  }
  .rect {
    width: 12px; height: 7px;
    border-radius: 2px;
    background: var(--fg);
  }
  .grid2 {
    display: grid;
    grid-template-columns: repeat(2, 3px);
    gap: 2px;
  }
  .grid2 i {
    width: 3px; height: 3px; border-radius: 50%;
    background: var(--fg); display: block;
  }
  .ptoggle {
    width: 16px; height: 9px;
    border: 1.2px solid var(--fg);
    border-radius: 9px;
    position: relative;
  }
  .ptoggle::after {
    content: "";
    position: absolute;
    left: 2px; top: 1.5px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--fg);
  }
  .block {
    width: 12px; height: 12px;
    border-radius: 3px;
    background: var(--fg);
  }
  .globe {
    width: 12px; height: 12px;
    border: 1.2px solid var(--fg);
    border-radius: 50%;
    position: relative;
  }
  .globe::before, .globe::after {
    content: "";
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 1px; background: var(--fg);
    transform: translateX(-50%);
  }
  .globe::after {
    left: 0; right: 0; top: 50%; height: 1px; width: auto;
    transform: none;
  }

  .foot {
    margin-top: auto;
    padding-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .moon {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: linear-gradient(90deg, var(--fg) 50%, transparent 50%);
    box-shadow: inset -1px 0 0 rgba(0,0,0,0.25);
  }
  .check {
    width: 14px; height: 14px;
    border: 1.2px solid var(--fg);
    border-radius: 50%;
    position: relative;
  }
  .check::after {
    content: "";
    position: absolute;
    left: 3px; top: 2px;
    width: 5px; height: 7px;
    border-right: 1.4px solid var(--fg);
    border-bottom: 1.4px solid var(--fg);
    transform: rotate(40deg);
  }
  .min {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="screen">
    <!-- Left: Apple + App menu (ref 3) -->
    <div class="pod sq apple"></div>
    <div class="pod app">
      <div class="ico"></div>
      <strong style="font-weight:500">Cursor Nightly</strong>
      <div class="menus">
        <span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span>
      </div>
    </div>

    <!-- Center media (ref 2) -->
    <div class="pod media">
      <div class="art"></div>
      <div>
        <div class="t">Alone</div>
        <div class="a">MPH</div>
      </div>
      <div class="ctrl"><span>⏮</span><span>▶</span><span>⏭</span></div>
    </div>

    <!-- Right cluster (ref 2) -->
    <div class="pod sq mail">✉</div>
    <div class="pod utils">
      <strong style="font-size:11px;font-weight:700;font-family:system-ui">B</strong>
      <span style="opacity:.55;font-size:11px">⌝</span>
      <span style="opacity:.9;font-size:11px">▦</span>
      <span style="opacity:.5;font-size:9px">▾</span>
    </div>
    <div class="pod status">
      <span class="g">▣</span>
      <span style="opacity:.9">▂</span>
      <span style="opacity:.55">♪</span>
    </div>
    <div class="pod clock">25/07 00:29</div>

    <!-- Vertical dock (refs 1 & 4) — geometric, not app icons -->
    <aside class="dock">
      <div class="cube" title="mark"></div>
      <div class="grid3"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="micro"></div>
      <div class="spaces">
        <div class="d y on"></div>
        <div class="div"></div>
        <div class="d b"></div>
        <div class="div"></div>
        <div class="d c"></div>
      </div>
      <div class="micro"></div>
      <div class="geo">
        <div class="rect"></div>
        <div class="grid2"><i></i><i></i><i></i><i></i></div>
        <div class="ptoggle"></div>
        <div class="block"></div>
        <div class="block" style="opacity:.7"></div>
        <div class="globe"></div>
      </div>
      <div class="foot">
        <div class="moon"></div>
        <div class="check"></div>
        <div class="min">29</div>
      </div>
    </aside>
  </div>
</body>
</html>
