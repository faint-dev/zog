<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zog — Design Preview</title>
<style>
  :root {
    --island: rgba(22, 22, 24, 0.92);
    --border: rgba(255, 255, 255, 0.14);
    --fg: rgba(255, 255, 255, 0.94);
    --muted: rgba(255, 255, 255, 0.58);
    --dim: rgba(255, 255, 255, 0.28);
    --green: #59d973;
    --yellow: #f2c747;
    --blue: #599efb;
    --cyan: #73d9f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    background: #0c0d10;
    color: var(--fg);
    overflow: hidden;
  }
  .desktop {
    position: relative;
    width: min(1280px, 100vw);
    height: min(800px, 100vh);
    margin: 4vh auto;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 40px 80px rgba(0,0,0,0.45);
    overflow: hidden;
  }
  .desktop::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 70% at 25% 35%, #5a6a88 0%, transparent 55%),
      radial-gradient(ellipse 80% 60% at 80% 70%, #6a5078 0%, transparent 50%),
      linear-gradient(160deg, #3a4254, #222632 55%, #2e2838);
  }
  .island {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 32px;
    padding: 0 12px;
    background: var(--island);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    font-size: 13px;
    white-space: nowrap;
    z-index: 2;
  }
  .island.media {
    height: 44px;
    border-radius: 16px;
    padding: 0 14px;
    gap: 12px;
  }
  .apple { top: 12px; left: 12px; width: 36px; justify-content: center; }
  .appmenu { top: 12px; left: 56px; }
  .media-island { top: 12px; left: 50%; transform: translateX(-50%); }
  .status { top: 12px; right: 180px; }
  .utils { top: 12px; right: 292px; }
  .mail { top: 12px; right: 400px; width: 36px; justify-content: center; }
  .clock {
    top: 12px; right: 76px;
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    font-weight: 500;
  }
  .app-icon {
    width: 16px; height: 16px; border-radius: 4px;
    background: linear-gradient(135deg, #7c8cff, #4a5fd4);
  }
  .art {
    width: 28px; height: 28px; border-radius: 6px;
    background: linear-gradient(135deg, #1a1a1a, #333);
  }
  .title { font-weight: 600; line-height: 1.15; }
  .artist { font-size: 11px; color: var(--muted); }
  .menus { display: flex; gap: 14px; color: var(--muted); margin-left: 4px; }
  .menus::before {
    content: "";
    width: 1px; height: 14px; background: var(--dim);
    margin-right: 8px; align-self: center;
  }
  .controls { display: flex; gap: 14px; color: var(--fg); font-size: 11px; }
  .green { color: var(--green); }
  .dock {
    position: absolute;
    top: 50%; right: 12px;
    transform: translateY(-50%);
    width: 52px;
    padding: 16px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    background: var(--island);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 26px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    z-index: 2;
  }
  @keyframes dockIn {
    from { opacity: 0; transform: translateY(-50%) translateX(12px); }
    to { opacity: 1; transform: translateY(-50%) translateX(0); }
  }
  .dock .mark { font-size: 16px; }
  .dock .grid { font-size: 10px; color: var(--muted); }
  .sep { width: 20px; height: 1px; background: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; opacity: 0.45; }
  .dot.on { opacity: 1; transform: scale(1.15); }
  .dot.y { background: var(--yellow); }
  .dot.b { background: var(--blue); }
  .dot.c { background: var(--cyan); }
  .dock-app {
    width: 26px; height: 26px; border-radius: 6px;
    background: linear-gradient(145deg, #555, #333);
    position: relative;
  }
  .dock-app::after {
    content: "";
    position: absolute;
    bottom: -6px; left: 50%; transform: translateX(-50%);
    width: 3px; height: 3px; border-radius: 50%;
    background: var(--fg);
  }
  .dock-app:nth-child(n+3)::after { display: none; }
  .label {
    position: absolute;
    bottom: 24px; left: 24px;
    font-size: 12px; color: var(--muted);
    letter-spacing: 0.04em;
    z-index: 2;
  }
  .label strong { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>
  <div class="desktop" aria-label="Zog macOS chrome preview">
    <div class="island apple"></div>
    <div class="island appmenu">
      <div class="app-icon"></div>
      <strong>Cursor Nightly</strong>
      <div class="menus"><span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span></div>
    </div>

    <div class="island media media-island">
      <div class="art"></div>
      <div>
        <div class="title">Alone</div>
        <div class="artist">MPH</div>
      </div>
      <div class="controls"><span>⏮</span><span>▶</span><span>⏭</span></div>
    </div>

    <div class="island mail">✉</div>
    <div class="island utils">Ⓑ · ▤ · ▾</div>
    <div class="island status"><span class="green">🔋</span> · 📶 · 🔊</div>
    <div class="island clock">25/07 00:29</div>

    <aside class="dock">
      <div class="mark">◼</div>
      <div class="grid">⋮⋮⋮</div>
      <div class="sep"></div>
      <div class="dot y on"></div>
      <div class="dot b"></div>
      <div class="dot c"></div>
      <div class="sep"></div>
      <div class="dock-app" style="background:linear-gradient(145deg,#6a8cff,#3346a8)"></div>
      <div class="dock-app" style="background:linear-gradient(145deg,#7ad97a,#2d6b3a)"></div>
      <div class="dock-app" style="background:linear-gradient(145deg,#f0c050,#9a6a20)"></div>
      <div class="sep"></div>
      <div style="font-size:14px;opacity:.9">◐</div>
      <div style="font-size:13px;opacity:.55">✓</div>
    </aside>

    <p class="label"><strong>Zog</strong> — floating islands + vertical dock · SketchyBar-inspired SwiftUI</p>
  </div>
</body>
</html>
